# The two entries for refind.conf. Replace OPENCORE with the name of the FAT32 volume that holds the EFI folder.
# rEFInd stays the main boot manager: do not change BootOrder, and do not add EFI/BOOT/BOOTx64.efi.
# Linux and Windows stay on their own entries, without going through OpenCore.

# The system with the drivers: after postinstall.py install
menuentry "OpenCore" {
    volume "OPENCORE"
    loader /EFI/OC/OpenCore.efi
}

# Install macOS and use the recovery. Not for the system with the drivers: see docs/RECOVERY.md
menuentry "OpenCore install" {
    volume "OPENCORE"
    loader /EFI/OC-INSTALL/OpenCore.efi
}
